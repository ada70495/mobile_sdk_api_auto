[pytest]
# 用例扫描目录
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 控制台详细输出 + Allure 原始数据 + 失败重跑 2 次（间隔 1 秒）
# --clean-alluredir 保证每次执行不叠加历史数据
addopts = -vs --alluredir=report/allure_raw --clean-alluredir --reruns=2 --reruns-delay=1

# 中文用例名在控制台正常显示
console_output_style = classic
