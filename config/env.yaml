# 环境切换：local（本地 Mock 服务）/ ci（Jenkins 容器访问宿主机）
current_env: "local"

local:
  base_url: "http://127.0.0.1:9000"
  timeout: 10
  sign_key: "mock-sign-key-2026"

ci:
  base_url: "http://host.docker.internal:9000"
  timeout: 15
  sign_key: "mock-sign-key-2026"

# 测试账号：本地 Mock 固定账号，不是真实凭据
# 真实项目的账号请写在 config/env_local.yaml（该文件已在 .gitignore 中排除，不会入库）
account:
  username: "testuser"
  password: "123456"
