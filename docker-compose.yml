# 相册接口自动化测试 - 环境编排
#   mock-album：本地被测服务，监听 9000，8 个业务接口
#   api-test：执行 pytest 用例的容器
#
# 用法：
#   一键跑全量：docker compose run --rm api-test
#   只起服务：docker compose up -d mock-album
#   停止清理：docker compose down

services:
  # ---------- 本地被测服务 ----------
  mock-album:
    image: python:3.11-slim
    container_name: mock-album-api
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple flask
             && python mock_server/app.py"
    environment:
      PORT: "9000"
      SIGN_CHECK: "false"
      SIGN_KEY: "mock-sign-key-2026"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- 用例执行 ----------
  api-test:
    image: python:3.11-slim
    container_name: album-api-test
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      mock-album:
        condition: service_healthy
    environment:
      ENV: "ci"
      # 同一 compose 网络内直接用服务名访问，不走 host.docker.internal
      BASE_URL: "http://mock-album:9000"
    command: >
      sh -c "pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
             && python -m pytest -p no:cacheprovider"
    profiles: ["test"]
