# 当前激活环境：test/pre/prod三选一
current_env: "test"
# 测试环境（脱敏域名）
test:
  base_url: "https://test-mobile-sdk.xxx.com"
# 预发环境
pre:
  base_url: "https://pre-mobile-sdk.xxx.com"
# 线上生产环境
prod:
  base_url: "https://prod-mobile-sdk.xxx.com"
# 【模板占位】
user:
  username: "${LOCAL_USER}"
  password: "${LOCAL_PWD}"
token: ""
sign_key: "${LOCAL_SIGN_KEY}"