# 相册文件夹创建接口
create_folder:
  uri: "/album/folder/create"
  method: "POST"
  cases:
    - case_name: "正常创建相册文件夹"
      json:
        name: "旅行相册"
        sort: 1
      expect:
        code: 200
    - case_name: "文件夹名称为空-参数异常"
      json:
        name: ""
        sort: 1
      expect:
        code: 400
        msg: "不能为空"
    - case_name: "文件夹名称只有空格-参数异常"
      json:
        name: "   "
        sort: 1
      expect:
        code: 400
        msg: "不能为空"
    - case_name: "文件夹名称26字-参数超限"
      json:
        name: "一二三四五六七八九十一二三四五六七八九十一二三四五六"
        sort: 1
      expect:
        code: 400
        msg: "超长"
    - case_name: "名称与已有相册重复-业务冲突"
      json:
        name: "自动化测试相册"
        sort: 1
      expect:
        code: 409
        msg: "已存在"
    - case_name: "排序值超出范围-参数异常"
      json:
        name: "排序越界相册"
        sort: 101
      expect:
        code: 400
        msg: "0-100"

# 图片上传接口
upload_image:
  uri: "/album/upload"
  method: "POST"
  cases:
    - case_name: "正常上传图片到指定相册"
      json:
        folder_id: 1001
        img_name: "test1.jpg"
        size_kb: 2048
      expect:
        code: 200
    - case_name: "相册ID不存在-越权访问拦截"
      json:
        folder_id: 999999
        img_name: "test1.jpg"
        size_kb: 1024
      expect:
        code: 403
        msg: "无权访问"
    - case_name: "图片名称为空-参数异常"
      json:
        folder_id: 1001
        img_name: ""
        size_kb: 1024
      expect:
        code: 400
        msg: "不能为空"
    - case_name: "图片格式不在白名单-参数异常"
      json:
        folder_id: 1001
        img_name: "anim.gif"
        size_kb: 1024
      expect:
        code: 400
        msg: "格式"
    - case_name: "图片超过5MB上限-参数超限"
      json:
        folder_id: 1001
        img_name: "big.jpg"
        size_kb: 10240
      expect:
        code: 400
        msg: "超出限制"
